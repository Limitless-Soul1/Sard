# Sard — release pipeline (RAWY-290).
#
# Push a `v*` tag and this builds the app, signs the updater artifacts, generates `latest.json`,
# creates the GitHub Release and uploads everything the in-app updater needs. Nothing about a
# release is edited by hand afterwards — which matters, because a manifest that has to be updated
# manually on every release is one that eventually is not, leaving users told they are current when
# they are not.
#
# The updater endpoint is `/releases/latest/download/latest.json`. GitHub resolves that to whatever
# the newest non-prerelease release is, so publishing a release is what makes it live.
#
# SECRETS REQUIRED (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the minisign private key generated by `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# Losing that key means never being able to ship an update to existing installs again — it cannot be
# regenerated, only replaced, and replacing it strands everyone already running Sard.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build a draft, so the pipeline can be exercised without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Windows-only for now: Sard ships a Windows-first build, and the MSI bundle can only be produced
    # on Windows. When macOS and Linux land, this becomes a matrix and tauri-action merges the
    # per-platform entries into one latest.json against the same release.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- THE RELEASE GATE (added after the 2026-08-07 diagnostic-build incident) ----------------
      #
      # A public release may be cut from `main` and from nothing else, and only from a tree with no
      # instrumentation in it. Neither condition was checked before, and neither would have caught
      # that incident on its own — the build reached the user through a stale cloud link, not through
      # CI. They are here because the next mistake will not be the last one: the cheapest place to
      # refuse to publish an experimental build is before it is built.
      - name: Refuse to release from anywhere but main
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag can point at any commit, including one that was never on main. Resolve it and
            # require that main actually contains it, rather than trusting the tag's name.
            git fetch --force --depth=200 origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "${{ github.sha }}" refs/remotes/origin/main; then
              echo "::error::tag ${{ github.ref_name }} points at ${{ github.sha }}, which is NOT on main."
              echo "::error::Public releases are cut from main only. Merge and review first."
              exit 1
            fi
            echo "tag ${{ github.ref_name }} -> ${{ github.sha }} is on main"
          elif [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::manual runs are allowed on main only; this is '${{ github.ref_name }}'."
            exit 1
          fi

      - name: Refuse to release with the diag feature on by default
        shell: bash
        run: |
          # If `diag` were a default feature, EVERY build would be a diagnostic build — including this
          # one. Checked here, in pure shell, so it fails in seconds alongside the branch check.
          if grep -qE '^\s*default\s*=\s*\[[^]]*"diag"' src-tauri/Cargo.toml; then
            echo "::error::the 'diag' Cargo feature is enabled by default in src-tauri/Cargo.toml."
            exit 1
          fi
          echo "the diag feature is off by default"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Placed AFTER the Node step on purpose: it is a Node script, and depending on whatever version
      # the runner image happens to preinstall is how a guard starts behaving differently from the one
      # that runs on a developer's machine.
      - name: Refuse to release a tree containing development-only files
        shell: bash
        run: |
          # Anything carried over from `develop` that has not been reviewed and cleaned shows up here:
          # diagnostic instrumentation, investigation reports, internal engineering docs, packaging
          # utilities and harnesses. The rule lives in scripts/check-production-tree.mjs rather than
          # being spelled out again here, so the check CI runs and the check run before a merge are
          # the same check — two copies of a rule is one rule and one stale copy.
          node scripts/check-production-tree.mjs

      # ---- THE CONTENT AUDIT'S CI HALF -------------------------------------------------------------
      #
      # The check above matches PATHS. It cannot see internal material inside a file that legitimately
      # ships, which is how a private machine path, four internal test modules and twenty-one
      # development npm scripts reached v1.2.2 while every gate reported success. The content gate that
      # does see them, and its rules, are development-only: shipping them would put the internal tooling
      # inventory back into the published tree — the exact thing being prevented. So CI cannot re-run it.
      #
      # What CI can do is check IDENTITY. The release step audits a tree, builds that same tree, and
      # records its SHA in the release commit. Here we recompute the tree of the commit being released
      # and require it to be that one. A tree the gates never saw — a hand-edited `main`, a tag pointing
      # at some other commit, a snapshot rebuilt after the audit — cannot pass.
      #
      # This is deliberately NOT a second copy of the content rules. Two copies of a rule is one rule and
      # one stale copy, and the drift would be invisible until it mattered.
      - name: Refuse to release a tree that was never audited
        shell: bash
        run: |
          TREE="$(git rev-parse HEAD^{tree})"
          CLAIM="$(git log -1 --format=%B | sed -n 's/^Audited-tree: \([0-9a-f]\{40\}\)$/\1/p' | tail -1)"
          if [ -z "$CLAIM" ]; then
            echo "::error::this commit carries no 'Audited-tree' record, so nothing proves its tree"
            echo "::error::passed the production-content and production-build gates."
            echo "::error::Releases are cut with 'npm run release:to-main -- --commit', which records it."
            exit 1
          fi
          if [ "$CLAIM" != "$TREE" ]; then
            echo "::error::the tree being released is NOT the tree that was audited."
            echo "::error::  audited: $CLAIM"
            echo "::error::  release: $TREE"
            echo "::error::Something changed after the gates ran. Re-cut the release; do not override this."
            exit 1
          fi
          echo "tree $TREE matches the audited tree recorded in the release commit"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      # The Rust build dominates the run; without a cache every release recompiles the whole tree.
      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # THE BUILD ID, generated here because nothing else in this workflow does.
      #
      # `scripts/build-identity.mjs` mints it, `build.rs` bakes it into the Rust binary and Vite
      # defines it for the frontend — but both read it from SARD_BUILD_ID in the environment, and
      # tauri-action runs `npm run tauri build` directly rather than through Sard's own build scripts.
      # So on a CI build the variable was simply never set, both halves fell back to their "UNSET"
      # string, and the finished artifact could not say which build produced it.
      #
      # That is what rejected the v1.2.1 artifact — after it had already been published, because the
      # verification then ran too late. An artifact that cannot identify itself cannot be supported:
      # every report it produces begins with an unanswerable question, which is the exact position the
      # 2026-08-07 investigation was stuck in. Setting it here fixes the cause rather than the symptom.
      - name: Generate the build id
        shell: bash
        run: |
          ID=$(node -e "import('./scripts/build-identity.mjs').then(m => console.log(m.buildId(m.kindOf('release'), { cwd: process.cwd() })))")
          case "$ID" in
            REL-*) ;;
            *) echo "::error::generated build id '$ID' is not a release id"; exit 1 ;;
          esac
          echo "SARD_BUILD_ID=$ID" >> "$GITHUB_ENV"
          echo "build id: $ID"

      # The release notes come from the ANNOTATED TAG's message. They end up in two places that
      # matter: the GitHub release page, and the `notes` field of latest.json — which is the text
      # the in-app update dialog shows the reader. Writing them at `git tag -a` time is what keeps
      # those two in step without anyone editing a manifest afterwards.
      - name: Read release notes from the tag
        id: notes
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" || true
            BODY="$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}")"
            [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ] && \
              BODY="$(git tag -l --format='%(contents)' "${{ github.ref_name }}")"
          fi
          # A tag with no annotation still has to produce something honest rather than an empty box.
          [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ] && \
            BODY="Download the installer below. See the repository for what changed."
          {
            echo "body<<SARD_NOTES_EOF"
            printf '%s\n' "$BODY"
            echo "SARD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Sard v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          # ALWAYS a draft, including for a tag. The verification below decides whether it becomes a
          # real release.
          #
          # This step builds, signs, creates the release AND uploads the assets in one action, so
          # publishing here would mean publishing before anything has been checked — which is exactly
          # what happened to v1.2.1: the artifact was rejected by the gate below, but the release was
          # already public, already marked latest, and already being offered to every installed copy
          # through the updater endpoint. A draft is not served by /releases/latest and does not appear
          # in the public release list, so a failed verification now leaves nothing for a user to find.
          releaseDraft: true
          prerelease: false
          # THE IMPORTANT ONE. Sard bundles both NSIS and MSI, and this input defaults to FALSE,
          # which would put the MSI in latest.json "for legacy reasons". The updater's tested Windows
          # path is the NSIS installer with /UPDATE: it runs per-user without an elevation prompt and
          # restarts the app itself. msiexec on a per-user install is a rougher road. The MSI stays a
          # release asset for people who want it; it is simply not the update payload.
          updaterJsonPreferNsis: true

      # The artifact itself is asked what it is, AFTER it exists. Every check above is about intent;
      # this one is about bytes, and it is the only one that could have caught a diagnostic build that
      # got this far. It reads the PE version resource (the same field a user sees under Properties →
      # Details), confirms the build id, and searches for instrumentation markers.
      #
      # It runs while the release is still a DRAFT. If it fails, the job stops here and the draft is
      # never promoted, so no user is ever offered an artifact that did not pass. That ordering is the
      # correction v1.2.1 forced: previously this ran after the release was already public, which made
      # the gate a post-mortem rather than a gate.
      - name: Verify the artifact is a PUBLIC RELEASE build
        shell: bash
        run: node scripts/verify-artifact.mjs --kind=release --exe=src-tauri/target/release/Sard.exe

      # ONLY NOW does the release become real. Everything above has passed: the ref is on main, the
      # tree carries no development-only files, the diag feature is off, the artifact is verified and
      # carries its build id. Promoting the draft is what makes the updater endpoint start serving it,
      # so it is deliberately the last thing that happens.
      #
      # A manual (workflow_dispatch) run is left as a draft, as before: it exists to exercise the
      # pipeline without publishing, and it can be inspected and discarded.
      - name: Publish the verified release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
          echo "published ${{ github.ref_name }}"
