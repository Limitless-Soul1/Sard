[package]
name = "sard"
version = "0.5.0"
description = "Sard (سَرْد) — a beautiful, Arabic-first ebook reader"
authors = ["Sard"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# RAWY-173 (AUD-9): a second launch focuses the existing window instead of starting a rival instance
# that would attach the same WAL DB + fight over per-session state.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RAWY-178 (AUD-12): `functions` enables `create_scalar_function` for the `afold` Arabic search fold
# (a rusqlite feature — no new external crate; the bundled SQLite already supports app functions).
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
# Import pipeline (RAWY-17): unzip EPUBs, hash for a stable id, parse the OPF.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
quick-xml = "0.36"
# TTS (RAWY-105): download Piper voice models on demand (voices are NOT bundled — installer stays small).
# ureq 3 (RAWY-111): bumped from 2 so it dedupes with msedge-tts's ureq (one copy in the tree).
ureq = "3"
# TTS engine #2 (RAWY-111): the FREE, keyless Edge "Read Aloud" neural voices (edge-tts protocol) —
# the Arabic-quality path. Blocking client (ureq + tungstenite + rustls), MIT, whole tree permissive.
msedge-tts = "0.4"
# RAWY-111: msedge-tts (aws-lc-rs) + ureq 3 (ring) compile TWO rustls crypto providers into one
# rustls, so `ClientConfig::builder()`'s auto-detection is ambiguous and PANICS (hanging the Edge WS
# connect). We install aws-lc-rs as the explicit process default at startup to disambiguate.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

